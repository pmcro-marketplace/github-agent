name: Verify native GitHub agent
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/github/**'
      - '.agents/**'
      - '.github/workflows/verify-native.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native runtime
        run: dotnet build plugins/github/skills/github/scripts/maf/Github.Agent.csproj -p:RestoreLockedMode=true
      - name: Validate upstream skill packages
        run: |
          for skill in plugins/github/skills/*; do
            python "$skill/scripts/validate.py"
          done
      - name: Verify write contracts against isolated HTTP fixture
        run: |
          mkdir -p dist/ci-native-proof-fixture
          dotnet run --project plugins/github/skills/github/scripts/write-tests/Write.Tests.csproj > dist/ci-native-proof-fixture/write-fixture.json
      - name: Verify actual native protocol invocation
        run: |
          python plugins/github/skills/github/scripts/prove_native.py dotnet plugins/github/skills/github/scripts/maf/bin/Debug/net10.0/Github.Agent.dll . dist/ci-native-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-native-proof
          path: |
            dist/ci-native-proof
            dist/ci-native-proof-fixture
          if-no-files-found: warn
